
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAYLY POLYA💕</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fb;color:#382b34;font-family:Arial,sans-serif}
header{background:#f6b8d5;padding:28px 22px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:27px}
header p{margin:8px 0 0;color:#70465c}
.balance{margin:20px;background:white;padding:20px;border-radius:20px;box-shadow:0 3px 15px #f0dce7}
.balance small{color:#98778a}
.coins{font-size:30px;font-weight:bold;margin-top:8px;color:#d45b99}
main{padding:0 20px 100px}
h2{font-size:19px;margin-top:25px}
.card{background:white;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #f3e4ed}
.item{display:flex;justify-content:space-between;align-items:center}
button{background:#ed8cbb;color:white;border:0;border-radius:12px;padding:11px 17px;font-weight:bold}
nav{position:fixed;bottom:0;left:0;width:100%;background:white;display:flex;justify-content:space-around;padding:15px 5px;box-shadow:0 -3px 15px #f0dce7}
nav button{background:transparent;color:#8d7181;font-size:12px;padding:8px}
</style>
</head>
<body>
<header>
<h1>DAYLY POLYA💕</h1>
<p>Твій простір маленьких перемог</p>
</header>
<div class="balance">
<small>ТВІЙ БАЛАНС</small>
<div class="coins">♡ 120 DC</div>
</div>
<main>
<h2>Привіт! 💗</h2>
<p>Час зробити щось чудове сьогодні.</p>
<h2>Мої завдання</h2>
<div class="card item">
<div>🌸 Ранкові справи<br><small>+10 DC</small></div>
<button onclick="complete(this)">Виконано</button>
</div>
<div class="card item">
<div>📚 Навчання<br><small>+20 DC</small></div>
<button onclick="complete(this)">Виконано</button>
</div>
<div class="card item">
<div>✨ Особистий час<br><small>+15 DC</small></div>
<button onclick="complete(this)">Виконано</button>
</div>
<h2>Нагадування</h2>
<div class="card">💕 Кожен маленький крок має значення!</div>
</main>
<nav>
<button onclick="location.reload()">🏠<br>Головна</button>
<button onclick="alert('Розділ завдань')">🌸<br>Завдання</button>
<button onclick="alert('Твій баланс: '+balance+' DC')">♡<br>DC</button>
<button onclick="alert('Профіль користувача')">👤<br>Профіль</button>
</nav>
<script>
let balance=120;
function complete(btn){
if(btn.disabled)return;
let amount=Number(btn.parentElement.querySelector('small').textContent.match(/\d+/)[0]);
balance+=amount;
document.querySelector('.coins').textContent='♡ '+balance+' DC';
btn.textContent='Готово ✓';
btn.disabled=true;
}
</script>
</body>
</html>
